name: Build and push Docker image

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKER_USERNAME }}/giftvaluebot:latest
            ${{ vars.DOCKER_USERNAME }}/giftvaluebot:${{ github.sha }}

      - name: Build & Push scheduler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.scheduler
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKER_USERNAME }}/giftvaluebot-scheduler:latest
            ${{ vars.DOCKER_USERNAME }}/giftvaluebot-scheduler:${{ github.sha }}
