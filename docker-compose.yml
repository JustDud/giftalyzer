services:
  bot:
    image: giftalyzer/giftvaluebot:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data_collection/portals:/app/data_collection/portals
    environment:
        TG_SESSION_PATH: /app/data_collection/portals/giftalyzerauth.session  # <— adjust name if different
    command: ["python","-m","manager","run-bot"]

  scheduler:
    image: giftalyzer/giftvaluebot-scheduler:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data_collection/portals:/app/data_collection/portals
